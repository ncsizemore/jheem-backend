# =============================================================================
# Run Custom Simulation
# =============================================================================
# Runs a custom simulation with user-specified parameters, extracts data in
# the same JSON format as batch mode, aggregates into a per-location file,
# and uploads to S3/CloudFront.
#
# The output is identical to prerun data — the portal renders it the same way.
#
# Scenario key is derived deterministically from parameters (e.g., "a50-o30-r40")
# so identical parameters always map to the same S3 path for caching.
#
# S3 layout:
#   portal/{s3Path}/custom/{location}/{scenario-key}.json
#
# Triggered manually (workflow_dispatch) or via API for portal-initiated runs.
# =============================================================================

name: Run Custom Simulation
run-name: "custom-sim: ${{ inputs.request_id != '' && inputs.request_id || format('legacy:{0}:{1}:{2}', inputs.model_id, inputs.location, inputs.parameters) }}"

# The portal supplies the canonical request ID. Legacy callers fall back to their
# exact raw inputs so they also gain duplicate serialization during migration.
concurrency:
  group: "custom-sim-${{ inputs.request_id != '' && inputs.request_id || format('legacy-{0}-{1}-{2}', inputs.model_id, inputs.location, inputs.parameters) }}"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Model ID from models.json (e.g., ryan-white-msa)'
        required: true
        default: 'ryan-white-msa'
        type: string
      location:
        description: 'Location code (e.g., C.12580 for MSA, AL for state)'
        required: true
        type: string
      parameters:
        description: 'JSON object of parameter values (e.g., {"adap_loss": 50, "oahs_loss": 30, "other_loss": 40})'
        required: true
        type: string
      request_id:
        description: 'Canonical portal request ID (v1:model:location:scenario); optional for legacy callers'
        required: false
        default: ''
        type: string
      release_override:
        description: 'Override data release tag (empty = use models.json)'
        required: false
        default: ''
        type: string
      container_image_override:
        description: 'Override container image (empty = use models.json)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Skip S3 upload (for testing)'
        required: false
        type: boolean
        default: false

jobs:
  custom-sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jheem-backend (for config)
        uses: actions/checkout@v4

      - name: Load model configuration
        id: config
        env:
          MODEL_ID: ${{ inputs.model_id }}
          LOCATION: ${{ inputs.location }}
          PARAMS: ${{ inputs.parameters }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONTAINER_IMAGE_OVERRIDE: ${{ inputs.container_image_override }}
          RELEASE_OVERRIDE: ${{ inputs.release_override }}
        run: |
          CONFIG_FILE=".github/config/models.json"

          echo "📋 Loading configuration for model: $MODEL_ID"

          # Verify model has customSimulation config
          HAS_CUSTOM=$(jq -r ".\"$MODEL_ID\".customSimulation // empty" $CONFIG_FILE)
          if [ -z "$HAS_CUSTOM" ]; then
            echo "❌ Model '$MODEL_ID' does not have customSimulation config in models.json"
            exit 1
          fi

          # --- Build scenario key and env vars from models.json parameter definitions ---
          # Read parameter definitions from models.json
          PARAM_DEFS=$(jq -c ".\"$MODEL_ID\".customSimulation.parameters" $CONFIG_FILE)

          # Build scenario key (e.g., "a50-o30-r40") and env var flags
          SCENARIO_KEY=""
          SCENARIO_LABEL=""
          ENV_FLAGS=""
          CACHE_KEY_PREFIX=$(echo "$HAS_CUSTOM" | jq -r '.cacheKeyPrefix // empty')
          PARAM_COUNT=$(echo "$PARAM_DEFS" | jq 'length')

          for i in $(seq 0 $((PARAM_COUNT - 1))); do
            PARAM_ID=$(echo "$PARAM_DEFS" | jq -r ".[$i].id")
            ENV_VAR=$(echo "$PARAM_DEFS" | jq -r ".[$i].envVar")
            KEY_PREFIX=$(echo "$PARAM_DEFS" | jq -r ".[$i].keyPrefix")
            LABEL=$(echo "$PARAM_DEFS" | jq -r ".[$i].label")
            DEFAULT=$(echo "$PARAM_DEFS" | jq -r ".[$i].default")
            UNIT=$(echo "$PARAM_DEFS" | jq -r ".[$i].unit")

            # Get value from user params, fall back to default
            VALUE=$(echo "$PARAMS" | jq -r ".${PARAM_ID} // $DEFAULT")

            # Defense in depth: parameter values must be integers 0-100.
            # The portal API already validates this, but the workflow
            # cannot trust the caller (workflow_dispatch is callable
            # directly with sufficient permissions).
            if ! [[ "$VALUE" =~ ^[0-9]+$ ]] || [ "$VALUE" -lt 0 ] || [ "$VALUE" -gt 100 ]; then
              echo "❌ Invalid value for $PARAM_ID: '$VALUE' (must be integer 0-100)"
              exit 1
            fi

            # Build scenario key part
            if [ -n "$SCENARIO_KEY" ]; then
              SCENARIO_KEY="${SCENARIO_KEY}-"
              SCENARIO_LABEL="${SCENARIO_LABEL}, "
            fi
            SCENARIO_KEY="${SCENARIO_KEY}${KEY_PREFIX}${VALUE}"
            SCENARIO_LABEL="${SCENARIO_LABEL}${LABEL} ${VALUE}${UNIT}"

            # Build docker env flags
            ENV_FLAGS="${ENV_FLAGS} -e ${ENV_VAR}=${VALUE}"
          done

          if [ -n "$CACHE_KEY_PREFIX" ]; then
            SCENARIO_KEY="${CACHE_KEY_PREFIX}-${SCENARIO_KEY}"
          fi

          # The backend derives the authoritative identity. A caller-provided
          # request ID is only a claim and must match exactly before compute.
          EXPECTED_REQUEST_ID="v1:${MODEL_ID}:${LOCATION}:${SCENARIO_KEY}"
          if [ -n "$REQUEST_ID" ] && [ "$REQUEST_ID" != "$EXPECTED_REQUEST_ID" ]; then
            echo "❌ Request ID mismatch"
            echo "   supplied: $REQUEST_ID"
            echo "   expected: $EXPECTED_REQUEST_ID"
            exit 1
          fi
          EFFECTIVE_REQUEST_ID="${REQUEST_ID:-$EXPECTED_REQUEST_ID}"

          echo "scenario_key=$SCENARIO_KEY" >> $GITHUB_OUTPUT
          echo "scenario_label=$SCENARIO_LABEL" >> $GITHUB_OUTPUT
          echo "env_flags=$ENV_FLAGS" >> $GITHUB_OUTPUT
          echo "request_id=$EFFECTIVE_REQUEST_ID" >> $GITHUB_OUTPUT

          # --- Read other config ---
          SIMULATION_SCRIPT=$(jq -r ".\"$MODEL_ID\".customSimulation.simulationScript" $CONFIG_FILE)
          echo "simulation_script=$SIMULATION_SCRIPT" >> $GITHUB_OUTPUT

          INTERVENTION_TYPE=$(jq -r ".\"$MODEL_ID\".customSimulation.interventionType // empty" $CONFIG_FILE)
          TIMING=$(jq -c ".\"$MODEL_ID\".customSimulation.timing // empty" $CONFIG_FILE)
          if [ "$SIMULATION_SCRIPT" = "simple_ryan_white.R" ]; then
            if [ "$INTERVENTION_TYPE" != "permanent_cessation" ]; then
              echo "❌ Ryan White custom simulations require interventionType=permanent_cessation"
              exit 1
            fi
            if ! echo "$TIMING" | jq -e '
              (.interventionStartTime | type == "number") and
              (.lossLagYears | type == "number") and
              (.simulationStartYear | type == "number") and
              (.simulationEndYear | type == "number") and
              (.reportingStartYear | type == "number") and
              (.reportingEndYear | type == "number") and
              (.lossLagYears >= 0) and
              (.simulationStartYear < .simulationEndYear) and
              (.interventionStartTime >= .simulationStartYear) and
              (.interventionStartTime <= .simulationEndYear) and
              (.reportingStartYear >= .simulationStartYear) and
              (.reportingEndYear <= .simulationEndYear) and
              (.reportingStartYear <= .reportingEndYear)
            ' >/dev/null; then
              echo "❌ Missing or invalid Ryan White custom-simulation timing configuration"
              exit 1
            fi
          fi

          INTERVENTION_START_TIME=$(echo "$TIMING" | jq -r '.interventionStartTime // empty')
          LOSS_LAG_YEARS=$(echo "$TIMING" | jq -r '.lossLagYears // empty')
          SIMULATION_START_YEAR=$(echo "$TIMING" | jq -r '.simulationStartYear // empty')
          SIMULATION_END_YEAR=$(echo "$TIMING" | jq -r '.simulationEndYear // empty')
          REPORTING_START_YEAR=$(echo "$TIMING" | jq -r '.reportingStartYear // empty')
          REPORTING_END_YEAR=$(echo "$TIMING" | jq -r '.reportingEndYear // empty')

          echo "intervention_type=$INTERVENTION_TYPE" >> $GITHUB_OUTPUT
          echo "intervention_start_time=$INTERVENTION_START_TIME" >> $GITHUB_OUTPUT
          echo "loss_lag_years=$LOSS_LAG_YEARS" >> $GITHUB_OUTPUT
          echo "simulation_start_year=$SIMULATION_START_YEAR" >> $GITHUB_OUTPUT
          echo "simulation_end_year=$SIMULATION_END_YEAR" >> $GITHUB_OUTPUT
          echo "reporting_start_year=$REPORTING_START_YEAR" >> $GITHUB_OUTPUT
          echo "reporting_end_year=$REPORTING_END_YEAR" >> $GITHUB_OUTPUT
          echo "cache_key_prefix=$CACHE_KEY_PREFIX" >> $GITHUB_OUTPUT

          CUSTOM_SIMULATION_METADATA=$(jq -cn \
            --arg model_id "$MODEL_ID" \
            --arg request_id "$EFFECTIVE_REQUEST_ID" \
            '{model_id: $model_id, request_id: $request_id, run_contract_version: "v1"}')
          if [ -n "$TIMING" ]; then
            TIMING_METADATA=$(jq -cn \
              --arg model_id "$MODEL_ID" \
              --arg intervention_type "$INTERVENTION_TYPE" \
              --arg cache_key_prefix "$CACHE_KEY_PREFIX" \
              --argjson intervention_start_time "$INTERVENTION_START_TIME" \
              --argjson loss_lag_years "$LOSS_LAG_YEARS" \
              --argjson simulation_start_year "$SIMULATION_START_YEAR" \
              --argjson simulation_end_year "$SIMULATION_END_YEAR" \
              --argjson reporting_start_year "$REPORTING_START_YEAR" \
              --argjson reporting_end_year "$REPORTING_END_YEAR" \
              '{model_id: $model_id, intervention_type: $intervention_type,
                intervention_start_time: $intervention_start_time,
                loss_lag_years: $loss_lag_years,
                simulation_start_year: $simulation_start_year,
                simulation_end_year: $simulation_end_year,
                reporting_start_year: $reporting_start_year,
                reporting_end_year: $reporting_end_year}
               + if $cache_key_prefix == "" then {} else {cache_key_prefix: $cache_key_prefix} end')
            CUSTOM_SIMULATION_METADATA=$(jq -cn \
              --argjson identity "$CUSTOM_SIMULATION_METADATA" \
              --argjson timing "$TIMING_METADATA" \
              '$identity + $timing')
          fi
          echo "custom_simulation_metadata=$CUSTOM_SIMULATION_METADATA" >> $GITHUB_OUTPUT

          OUTCOMES=$(jq -r ".\"$MODEL_ID\".outcomes | join(\",\")" $CONFIG_FILE)
          echo "outcomes=$OUTCOMES" >> $GITHUB_OUTPUT

          STATISTICS=$(jq -r ".\"$MODEL_ID\".customSimulation.statistics | join(\",\")" $CONFIG_FILE)
          echo "statistics=$STATISTICS" >> $GITHUB_OUTPUT

          FACETS=$(jq -r ".\"$MODEL_ID\".customSimulation.facets | join(\",\")" $CONFIG_FILE)
          echo "facets=$FACETS" >> $GITHUB_OUTPUT

          # Container image
          CONFIG_CONTAINER=$(jq -r ".\"$MODEL_ID\".container.image + \":\" + .\"$MODEL_ID\".container.version" $CONFIG_FILE)
          if [ -n "$CONTAINER_IMAGE_OVERRIDE" ]; then
            CONTAINER_IMAGE="$CONTAINER_IMAGE_OVERRIDE"
          else
            CONTAINER_IMAGE="$CONFIG_CONTAINER"
          fi
          echo "container_image=$CONTAINER_IMAGE" >> $GITHUB_OUTPUT

          # Data source
          CONFIG_RELEASE=$(jq -r ".\"$MODEL_ID\".dataSource.release" $CONFIG_FILE)
          DATA_SOURCE_PATTERN=$(jq -r ".\"$MODEL_ID\".dataSource.filePattern // empty" $CONFIG_FILE)
          if [ -n "$RELEASE_OVERRIDE" ]; then
            RELEASE="$RELEASE_OVERRIDE"
          else
            RELEASE="$CONFIG_RELEASE"
          fi
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "data_source_pattern=$DATA_SOURCE_PATTERN" >> $GITHUB_OUTPUT

          # Output paths
          S3_BUCKET=$(jq -r ".\"$MODEL_ID\".output.s3Bucket" $CONFIG_FILE)
          S3_PATH=$(jq -r ".\"$MODEL_ID\".output.s3Path" $CONFIG_FILE)
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "s3_path=$S3_PATH" >> $GITHUB_OUTPUT

          # CloudFront
          CF_DIST_ID=$(jq -r "._infrastructure.cloudfrontDistributionId" $CONFIG_FILE)
          echo "cloudfront_distribution_id=$CF_DIST_ID" >> $GITHUB_OUTPUT

          echo ""
          echo "=========================================="
          echo "Custom simulation configuration"
          echo "=========================================="
          echo "  Location:      $LOCATION"
          echo "  Scenario key:  $SCENARIO_KEY"
          echo "  Request ID:    $EFFECTIVE_REQUEST_ID"
          echo "  Scenario label: $SCENARIO_LABEL"
          echo "  Intervention:  $INTERVENTION_TYPE"
          if [ -n "$INTERVENTION_START_TIME" ]; then
            echo "  Timing:        intervention=$INTERVENTION_START_TIME, lag=$LOSS_LAG_YEARS, simulation=$SIMULATION_START_YEAR-$SIMULATION_END_YEAR, reporting=$REPORTING_START_YEAR-$REPORTING_END_YEAR"
          fi
          echo "  Container:     $CONTAINER_IMAGE"
          echo "  Release:       $RELEASE"
          echo "  Outcomes:      $OUTCOMES"
          echo "  Statistics:    $STATISTICS"
          echo "  Facets:        $FACETS"
          echo "  S3 path:       s3://$S3_BUCKET/$S3_PATH/custom/$LOCATION/$SCENARIO_KEY.json"

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check for an already-published result
        if: inputs.dry_run != true
        id: cache
        env:
          LOCATION: ${{ inputs.location }}
          S3_BUCKET: ${{ steps.config.outputs.s3_bucket }}
          S3_PATH: ${{ steps.config.outputs.s3_path }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
        run: |
          OBJECT_KEY="${S3_PATH}/custom/${LOCATION}/${SCENARIO_KEY}.json"
          HEAD_ERROR=$(mktemp)
          set +e
          aws s3api head-object --bucket "$S3_BUCKET" --key "$OBJECT_KEY" >/dev/null 2>"$HEAD_ERROR"
          HEAD_STATUS=$?
          set -e

          if [ "$HEAD_STATUS" -eq 0 ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "✅ Result already exists at s3://${S3_BUCKET}/${OBJECT_KEY}; skipping duplicate compute"
          elif grep -Eq '\(404\)|Not Found' "$HEAD_ERROR"; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss; continuing with simulation"
          else
            echo "❌ Unable to verify result cache; refusing to risk duplicate compute"
            cat "$HEAD_ERROR"
            exit "$HEAD_STATUS"
          fi

      - name: Download base simset from GitHub Release
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCATION: ${{ inputs.location }}
          RELEASE: ${{ steps.config.outputs.release }}
          PATTERN: ${{ steps.config.outputs.data_source_pattern }}
        run: |
          # Build download pattern
          if [ -n "$PATTERN" ]; then
            DL_PATTERN=$(echo "$PATTERN" | sed "s/{STATE}/$LOCATION/g" | sed "s/{LOC}/$LOCATION/g")
          else
            DL_PATTERN="*${LOCATION}*"
          fi

          echo "📥 Downloading base simset from $RELEASE (pattern: $DL_PATTERN)"
          mkdir -p simulations

          gh release download "$RELEASE" \
            --repo ncsizemore/jheem-simulations \
            --pattern "$DL_PATTERN" \
            --dir ./simulations

          echo "📦 Downloaded files:"
          ls -lh ./simulations/

          # Keep only the base file (contains "base" or "noint")
          for f in ./simulations/*.Rdata; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            if [[ "$filename" != *"base"* ]] && [[ "$filename" != *"noint"* ]]; then
              echo "  Removing non-base file: $filename"
              rm "$f"
            fi
          done

          echo "✅ Base simset ready:"
          ls -lh ./simulations/

      - name: Login to GitHub Container Registry
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout jheem-portal (for aggregation scripts)
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ncsizemore/jheem-portal
          path: portal

      - name: Setup Node.js
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install portal dependencies
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        working-directory: portal
        # GITHUB_TOKEN is needed by the portal's postinstall (sync-config.ts)
        # to fetch models.json from this (now-private) repo via the
        # authenticated GitHub Contents API. The runner-issued token has
        # contents:read on its own repo by default, which is exactly what
        # the script needs. Passed via env: (not interpolated into the
        # shell body) for the same reason all the other secrets are.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run custom simulation
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        env:
          LOCATION: ${{ inputs.location }}
          MODEL_ID: ${{ inputs.model_id }}
          SIMULATION_SCRIPT: ${{ steps.config.outputs.simulation_script }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
          SCENARIO_LABEL: ${{ steps.config.outputs.scenario_label }}
          ENV_FLAGS: ${{ steps.config.outputs.env_flags }}
          CONTAINER_IMAGE: ${{ steps.config.outputs.container_image }}
          OUTCOMES: ${{ steps.config.outputs.outcomes }}
          STATISTICS: ${{ steps.config.outputs.statistics }}
          FACETS: ${{ steps.config.outputs.facets }}
          INTERVENTION_TYPE: ${{ steps.config.outputs.intervention_type }}
          INTERVENTION_START_TIME: ${{ steps.config.outputs.intervention_start_time }}
          LOSS_LAG_YEARS: ${{ steps.config.outputs.loss_lag_years }}
          SIMULATION_START_YEAR: ${{ steps.config.outputs.simulation_start_year }}
          SIMULATION_END_YEAR: ${{ steps.config.outputs.simulation_end_year }}
          REPORTING_START_YEAR: ${{ steps.config.outputs.reporting_start_year }}
          REPORTING_END_YEAR: ${{ steps.config.outputs.reporting_end_year }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          echo "🚀 Running custom simulation for $LOCATION..."
          echo "   Scenario: $SCENARIO_KEY"
          echo ""

          mkdir -p output

          # Progress key for Upstash Redis — portal status API reads this
          PROGRESS_KEY="progress:${MODEL_ID}:${LOCATION}:${SCENARIO_KEY}"
          REPORTER="./scripts/report-progress.sh"

          # Compute expected file count for extraction progress
          # (outcomes × statistics × facets — some combos may not exist)
          n_outcomes=$(echo "$OUTCOMES" | tr ',' '\n' | wc -l)
          n_statistics=$(echo "$STATISTICS" | tr ',' '\n' | wc -l)
          n_facets=$(echo "$FACETS" | tr ',' '\n' | wc -l)
          expected_files=$((n_outcomes * n_statistics * n_facets))

          # Step 1: Run custom simulation
          # $ENV_FLAGS is intentionally unquoted so the shell word-splits it
          # into separate -e flags. Its values were validated as integers 0-100
          # in the "Load model configuration" step.
          set +e
          docker run --rm \
            -v "$(pwd)/simulations:/data:ro" \
            -v "$(pwd)/output:/output" \
            -e "LOCATION=$LOCATION" \
            -e "MODEL_ID=$MODEL_ID" \
            -e "SIMULATION_SCRIPT=$SIMULATION_SCRIPT" \
            -e "SCENARIO_KEY=$SCENARIO_KEY" \
            -e "SCENARIO_LABEL=$SCENARIO_LABEL" \
            -e "OUTPUT_DIR=/output" \
            -e "INTERVENTION_TYPE=$INTERVENTION_TYPE" \
            -e "INTERVENTION_START_TIME=$INTERVENTION_START_TIME" \
            -e "LOSS_LAG_YEARS=$LOSS_LAG_YEARS" \
            -e "SIMULATION_START_YEAR=$SIMULATION_START_YEAR" \
            -e "SIMULATION_END_YEAR=$SIMULATION_END_YEAR" \
            -e "REPORTING_START_YEAR=$REPORTING_START_YEAR" \
            -e "REPORTING_END_YEAR=$REPORTING_END_YEAR" \
            $ENV_FLAGS \
            "$CONTAINER_IMAGE" \
            custom 2>&1 | "$REPORTER" sim "$PROGRESS_KEY"
          sim_exit=${PIPESTATUS[0]}
          set -e
          if [ "$sim_exit" -ne 0 ]; then
            echo "❌ Custom simulation failed (exit code $sim_exit)"
            exit "$sim_exit"
          fi

          # Step 2: Extract data from simsets
          echo ""
          echo "📊 Running batch extraction..."
          "$REPORTER" phase "$PROGRESS_KEY" extracting "Generating data files..."

          set +e
          docker run --rm \
            -v "$(pwd)/output/simulations:/app/simulations:ro" \
            -v "$(pwd)/output:/output" \
            -e "MODEL_ID=$MODEL_ID" \
            "$CONTAINER_IMAGE" \
            batch \
            --city "$LOCATION" \
            --scenarios "$SCENARIO_KEY" \
            --outcomes "$OUTCOMES" \
            --statistics "$STATISTICS" \
            --facets "$FACETS" \
            --output-dir "/output/$LOCATION/$SCENARIO_KEY" \
            --output-mode data \
            --json-only 2>&1 | "$REPORTER" extract "$PROGRESS_KEY" "$expected_files"
          batch_exit=${PIPESTATUS[0]}
          set -e

          file_count=$(find output -name "*.json" 2>/dev/null | wc -l)
          echo ""
          echo "📊 Generated $file_count JSON files (batch exit code: $batch_exit)"

          if [ "$file_count" -eq 0 ]; then
            echo "❌ No files generated"
            exit 1
          fi

          # Signal transition to upload phase
          "$REPORTER" phase "$PROGRESS_KEY" uploading "Uploading results..."
          echo "✅ Custom simulation and extraction complete"

      - name: Aggregate location data
        if: inputs.dry_run == true || steps.cache.outputs.hit != 'true'
        working-directory: portal
        env:
          LOCATION: ${{ inputs.location }}
          CUSTOM_SIMULATION_METADATA: ${{ steps.config.outputs.custom_simulation_metadata }}
        run: |
          echo "📊 Aggregating data for $LOCATION..."

          mkdir -p public/data

          # Find the location directory in output
          location_dir="../output/$LOCATION"
          if [ ! -d "$location_dir" ]; then
            echo "Looking for output directory..."
            find ../output -type d -maxdepth 2
            location_dir=$(find ../output -type d -name "$LOCATION" | head -1)
          fi

          echo "Using directory: $location_dir"
          output_file="public/data/$LOCATION.json"
          npx tsx scripts/aggregate-city-data.ts "$location_dir" "$output_file"

          if [ ! -f "$output_file" ]; then
            echo "❌ Failed to create $LOCATION.json"
            exit 1
          fi

          # The backend owns this runtime provenance contract. Inject it here
          # after aggregation so publication does not depend on the checked-out
          # portal revision understanding CUSTOM_SIMULATION_METADATA.
          if [ -n "$CUSTOM_SIMULATION_METADATA" ]; then
            metadata_file=$(mktemp)
            jq --compact-output \
              --argjson custom_simulation "$CUSTOM_SIMULATION_METADATA" \
              '(.metadata //= {}) |
               .metadata.custom_simulation = $custom_simulation' \
              "$output_file" > "$metadata_file"
            mv "$metadata_file" "$output_file"

            jq --exit-status \
              --argjson custom_simulation "$CUSTOM_SIMULATION_METADATA" \
              '.metadata.custom_simulation == $custom_simulation' \
              "$output_file" >/dev/null
            echo "✅ Embedded custom-simulation timing metadata"
          fi

          size=$(ls -lh "$output_file" | awk '{print $5}')
          echo "✅ Created $LOCATION.json ($size)"

      - name: Upload to S3
        if: inputs.dry_run != true && steps.cache.outputs.hit != 'true'
        working-directory: portal
        env:
          LOCATION: ${{ inputs.location }}
          S3_BUCKET: ${{ steps.config.outputs.s3_bucket }}
          S3_PATH: ${{ steps.config.outputs.s3_path }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
        run: |
          S3_DEST="s3://${S3_BUCKET}/${S3_PATH}/custom/${LOCATION}/${SCENARIO_KEY}.json"

          echo "☁️ Uploading to $S3_DEST"

          gzip -c "public/data/${LOCATION}.json" > "public/data/${LOCATION}.json.gz"

          aws s3 cp "public/data/${LOCATION}.json.gz" \
            "$S3_DEST" \
            --content-type "application/json" \
            --content-encoding "gzip"

          echo "✅ Uploaded to S3"

      - name: Invalidate CloudFront cache
        if: inputs.dry_run != true && steps.cache.outputs.hit != 'true'
        env:
          LOCATION: ${{ inputs.location }}
          S3_PATH: ${{ steps.config.outputs.s3_path }}
          CF_DIST_ID: ${{ steps.config.outputs.cloudfront_distribution_id }}
        run: |
          CF_PATH="/${S3_PATH#portal/}/custom/${LOCATION}/*"

          echo "🔄 Invalidating CloudFront cache for $CF_PATH"

          aws cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "$CF_PATH" \
            --output text

          echo "✅ Cache invalidation requested"

      - name: Skip S3 upload (dry run)
        if: inputs.dry_run == true
        env:
          LOCATION: ${{ inputs.location }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
        run: |
          echo "🔸 DRY RUN — Skipping S3 upload"
          echo "Would upload to: custom/${LOCATION}/${SCENARIO_KEY}.json"

      - name: Notify completion
        # Calls the portal, which drains any queued email notifications
        # for this scenario and sends them via Resend. Email never
        # transits this workflow — see jheem-portal/src/lib/notify.ts
        # for the stash/drain design. continue-on-error so a transient
        # portal failure does not mark the whole run as failed.
        if: success() && inputs.dry_run != true
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          MODEL_ID: ${{ inputs.model_id }}
          LOCATION: ${{ inputs.location }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
        run: |
          PAYLOAD=$(jq -n \
            --arg modelId "$MODEL_ID" \
            --arg location "$LOCATION" \
            --arg scenarioKey "$SCENARIO_KEY" \
            '{modelId: $modelId, location: $location, scenarioKey: $scenarioKey}')

          RESPONSE=$(curl --silent --show-error --fail \
            -X POST https://jheem.org/api/custom-sim/notify \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "🔔 Portal notify response: $RESPONSE"

      - name: Summary
        if: always()
        env:
          MODEL_ID: ${{ inputs.model_id }}
          LOCATION: ${{ inputs.location }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCENARIO_KEY: ${{ steps.config.outputs.scenario_key }}
          REQUEST_ID: ${{ steps.config.outputs.request_id }}
          SCENARIO_LABEL: ${{ steps.config.outputs.scenario_label }}
          S3_PATH: ${{ steps.config.outputs.s3_path }}
        run: |
          echo ""
          echo "=========================================="
          echo "Custom Simulation Summary"
          echo "=========================================="
          echo ""
          echo "Model: $MODEL_ID"
          echo "Location: $LOCATION"
          echo "Scenario key: $SCENARIO_KEY"
          echo "Request ID: $REQUEST_ID"
          echo "Scenario label: $SCENARIO_LABEL"
          echo "Dry run: $DRY_RUN"
          if [ "$DRY_RUN" != "true" ]; then
            echo ""
            echo "Data: https://d320iym4dtm9lj.cloudfront.net/${S3_PATH#portal/}/custom/${LOCATION}/${SCENARIO_KEY}.json"
          fi
