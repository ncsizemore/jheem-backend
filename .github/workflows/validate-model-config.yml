name: Validate model configuration

on:
  pull_request:
    paths:
      - .github/config/models.json
      - scripts/validate-model-config.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  push:
    branches: [master]
    paths:
      - .github/config/models.json
      - scripts/validate-model-config.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-model-config.mjs
