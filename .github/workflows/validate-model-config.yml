name: Validate model configuration

on:
  pull_request:
    paths:
      - .github/config/models.json
      - .github/workflows/run-custom-sim.yml
      - .github/workflows/_generate-data-template.yml
      - package.json
      - scripts/validate.mjs
      - scripts/validate-model-config.mjs
      - scripts/validate-workflow-actions.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  push:
    branches: [master]
    paths:
      - .github/config/models.json
      - .github/workflows/run-custom-sim.yml
      - .github/workflows/_generate-data-template.yml
      - package.json
      - scripts/validate.mjs
      - scripts/validate-model-config.mjs
      - scripts/validate-workflow-actions.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
