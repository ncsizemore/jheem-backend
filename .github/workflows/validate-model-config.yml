name: Validate model configuration

on:
  pull_request:
    paths:
      - .github/config/models.json
      - .github/config/calibration-promotion.json
      - .github/workflows/promote-calibration.yml
      - scripts/promote-calibration.mjs
      - scripts/calibration-promotion.mjs
      - scripts/test-calibration-promotion.mjs
      - .github/workflows/run-custom-sim.yml
      - .github/workflows/_generate-data-template.yml
      - package-lock.json
      - package.json
      - scripts/validate.mjs
      - scripts/validate-model-config.mjs
      - scripts/calibration-bindings.mjs
      - scripts/validate-calibration-config.mjs
      - scripts/test-calibration-bindings.mjs
      - scripts/validate-workflow-actions.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  push:
    branches: [master]
    paths:
      - .github/config/models.json
      - .github/config/calibration-promotion.json
      - .github/workflows/promote-calibration.yml
      - scripts/promote-calibration.mjs
      - scripts/calibration-promotion.mjs
      - scripts/test-calibration-promotion.mjs
      - .github/workflows/run-custom-sim.yml
      - .github/workflows/_generate-data-template.yml
      - package-lock.json
      - package.json
      - scripts/validate.mjs
      - scripts/validate-model-config.mjs
      - scripts/calibration-bindings.mjs
      - scripts/validate-calibration-config.mjs
      - scripts/test-calibration-bindings.mjs
      - scripts/validate-workflow-actions.mjs
      - .github/workflows/validate-model-config.yml
      - '.github/workflows/generate-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm test
      - run: npm run audit:production
      - name: Read calibration consumer pin
        id: calibration
        run: |
          node -e '
            const fs = require("node:fs");
            const pin = JSON.parse(fs.readFileSync(".github/config/calibration-promotion.json"));
            if (!/^[a-f0-9]{40}$/.test(pin.consumer_commit)) throw new Error("Invalid consumer pin");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${pin.consumer_commit}\nrepository=${pin.consumer_repository}\n`);
          '
      - name: Check out pinned calibration consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.calibration.outputs.repository }}
          ref: ${{ steps.calibration.outputs.commit }}
          path: consumer
          persist-credentials: false
      - name: Preview real calibration release without AWS credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/promote-calibration.mjs --consumer consumer --output delivery --mode plan
      - name: Verify model bindings against release and CloudFront
        run: node scripts/validate-calibration-config.mjs --artifacts delivery/static --delivery
